# ==============================================================================
# GitLab CI/CD Pipeline - Enterprise Grade
# Project: Tambora Web App (Nuxt 4 Frontend)
# ==============================================================================

workflow:
  rules:
    # Jalankan pipeline pada Merge Request
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Cegah duplicate pipeline pada branch yang memiliki open MR
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Jalankan pipeline pada commit branch biasa (misal: main)
    - if: '$CI_COMMIT_BRANCH'
    # Jalankan pipeline pada release tag
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - security
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

# ------------------------------------------------------------------------------
# Cache Template
# ------------------------------------------------------------------------------
.npm_cache: &npm_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

# ==============================================================================
# STAGE: TEST (Lint & Quality Gatekeeper)
# ==============================================================================
lint:
  stage: test
  image: node:22-alpine
  <<: *npm_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --legacy-peer-deps
  script:
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

unit-test:
  stage: test
  image: node:22-alpine
  <<: *npm_cache
  before_script:
    - npm ci --cache .npm --prefer-offline --legacy-peer-deps
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    name: "coverage-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - coverage/
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build-check:
  stage: test
  image: node:22-alpine
  <<: *npm_cache
  before_script:
    - npm ci --cache .npm --prefer-offline --legacy-peer-deps
  script:
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# STAGE: BUILD (Docker Multi-Stage with Layer Caching)
# ==============================================================================
docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Pulling previous latest image for build caching..."
    - docker pull "$DOCKER_IMAGE:latest" || true
    - echo "Building Docker image..."
    - >
      docker build
      --cache-from "$DOCKER_IMAGE:latest"
      -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
      -t "$DOCKER_IMAGE:latest"
      .
    - echo "Pushing Docker images to registry..."
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ==============================================================================
# STAGE: SECURITY (SonarQube & Container Vulnerability Scan)
# ==============================================================================
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  needs:
    - job: unit-test
      artifacts: true
      optional: true
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN && ($CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event")'

container-security-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - echo "Scanning Docker image for HIGH and CRITICAL vulnerabilities..."
    - trivy image --exit-code 0 --severity "$TRIVY_SEVERITY" --format table "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
  allow_failure: true
  needs:
    - job: docker-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ==============================================================================
# STAGE: DEPLOY (Safe Zero-Downtime Deployment to Production)
# ==============================================================================
deploy:production:
  stage: deploy
  image: alpine:3.22
  environment:
    name: production
    url: http://$VPS_HOST:9091
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      DEPLOY_USER="${DEPLOY_USER:-root}"
      echo "Menghubungkan ke $DEPLOY_USER@$VPS_HOST ..."

      ssh -i ~/.ssh/id_ed25519 $DEPLOY_USER@$VPS_HOST << EOF
      set -euo pipefail

      echo "=== 1. Login Docker Registry ==="
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      echo "=== 2. Pull Immutable Image ($DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA) ==="
      docker pull "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"

      echo "=== 3. Validasi Container Baru (Pre-flight Healthcheck) ==="
      docker rm -f tambora-frontend-test 2>/dev/null || true

      docker run -d \
        --name tambora-frontend-test \
        --env-file /opt/tambora/frontend/.env \
        "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"

      HEALTHY=0
      for i in \$(seq 1 15); do
        if docker exec tambora-frontend-test wget -q --spider http://127.0.0.1:3000/ 2>/dev/null; then
          echo "Health check berhasil pada percobaan ke-\$i!"
          HEALTHY=1
          break
        fi
        echo "Menunggu aplikasi siap... (\$i/15)"
        sleep 2
      done

      docker rm -f tambora-frontend-test 2>/dev/null || true

      if [ "\$HEALTHY" -ne 1 ]; then
        echo "FATAL: Health check container baru gagal! Membatalkan deployment demi keamanan sistem."
        exit 1
      fi

      echo "=== 4. Atomic Switch ke Container Baru ==="
      docker stop tambora-frontend 2>/dev/null || true
      docker rename tambora-frontend tambora-frontend-old 2>/dev/null || true

      docker run -d \
        --name tambora-frontend \
        --restart unless-stopped \
        -p 9091:3000 \
        --env-file /opt/tambora/frontend/.env \
        "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"

      docker rm -f tambora-frontend-old 2>/dev/null || true
      docker image prune -f --filter "until=72h" || true

      echo "=== Deployment Berhasil Selesai! ==="
      docker ps --filter "name=tambora-frontend"
      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

