stages:
  - build
  - deploy

# ============================================================
# VARIABLES
# ============================================================

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# ============================================================
# BUILD DOCKER IMAGE
# ============================================================

build:
  stage: build

  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - echo "======================================"
    - echo "Docker Login"
    - echo "======================================"

    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" \
      -u "$CI_REGISTRY_USER" \
      --password-stdin

  script:
    - echo "======================================"
    - echo "Building Frontend Docker Image"
    - echo "======================================"

    - docker build \
      -t "$DOCKER_IMAGE:$CI_COMMIT_SHA" \
      .

    - echo "======================================"
    - echo "Pushing Frontend Image"
    - echo "======================================"

    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHA"

    - echo "======================================"
    - echo "Tagging Latest"
    - echo "======================================"

    - docker tag \
      "$DOCKER_IMAGE:$CI_COMMIT_SHA" \
      "$DOCKER_IMAGE:latest"

    - docker push "$DOCKER_IMAGE:latest"

    - echo "======================================"
    - echo "Frontend Build Completed"
    - echo "======================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# DEPLOY TO VPS
# ============================================================

deploy:
  stage: deploy

  image: alpine:3.22

  before_script:
    # ========================================================
    # INSTALL SSH
    # ========================================================

    - apk add --no-cache openssh-client

    # ========================================================
    # PREPARE SSH
    # ========================================================

    - mkdir -p ~/.ssh

    # ========================================================
    # SSH PRIVATE KEY
    #
    # SSH_PRIVATE_KEY adalah GitLab Variable biasa
    # bukan File Variable
    # ========================================================

    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519

    - chmod 600 ~/.ssh/id_ed25519

    # ========================================================
    # VALIDATE SSH KEY
    # ========================================================

    - echo "======================================"
    - echo "Validating SSH Private Key"
    - echo "======================================"

    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

    - echo "SSH private key is valid"

    # ========================================================
    # VPS HOST KEY
    # ========================================================

    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

  script:
    # ========================================================
    # TEST SSH
    # ========================================================

    - echo "======================================"
    - echo "Testing SSH Connection"
    - echo "======================================"

    - ssh \
      -i ~/.ssh/id_ed25519 \
      -o StrictHostKeyChecking=yes \
      "root@$VPS_HOST" \
      "echo 'SSH connection successful'"

    # ========================================================
    # START DEPLOYMENT
    # ========================================================

    - echo "======================================"
    - echo "Starting Frontend Deployment"
    - echo "======================================"

    - |
      ssh \
        -i ~/.ssh/id_ed25519 \
        -o StrictHostKeyChecking=yes \
        "root@$VPS_HOST" \
        "CI_REGISTRY='$CI_REGISTRY' \
         CI_REGISTRY_USER='$CI_REGISTRY_USER' \
         CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' \
         DOCKER_IMAGE='$DOCKER_IMAGE' \
         CI_COMMIT_SHA='$CI_COMMIT_SHA' \
         bash -s" << 'EOF'


      set -e


      # ======================================================
      # INFORMATION
      # ======================================================

      echo "======================================"
      echo "TAMBORA FRONTEND DEPLOYMENT"
      echo "======================================"

      echo "Docker Image : $DOCKER_IMAGE"
      echo "Commit SHA   : $CI_COMMIT_SHA"
      echo "Port         : 9091"


      # ======================================================
      # CHECK DOCKER
      # ======================================================

      echo "======================================"
      echo "Checking Docker"
      echo "======================================"

      docker --version


      # ======================================================
      # LOGIN GITLAB CONTAINER REGISTRY
      # ======================================================

      echo "======================================"
      echo "Login to GitLab Container Registry"
      echo "======================================"

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" \
        -u "$CI_REGISTRY_USER" \
        --password-stdin


      # ======================================================
      # PULL NEW IMAGE
      # ======================================================

      echo "======================================"
      echo "Pulling Frontend Image"
      echo "======================================"

      docker pull "$DOCKER_IMAGE:$CI_COMMIT_SHA"


      # ======================================================
      # STOP OLD CONTAINER
      # ======================================================

      echo "======================================"
      echo "Stopping Old Frontend Container"
      echo "======================================"

      docker stop tambora-frontend 2>/dev/null || true


      # ======================================================
      # REMOVE OLD CONTAINER
      # ======================================================

      echo "======================================"
      echo "Removing Old Frontend Container"
      echo "======================================"

      docker rm tambora-frontend 2>/dev/null || true


      # ======================================================
      # START NEW CONTAINER
      # ======================================================

      echo "======================================"
      echo "Starting New Frontend Container"
      echo "======================================"

      docker run -d \
        --name tambora-frontend \
        --restart unless-stopped \
        -p 9091:9091 \
        "$DOCKER_IMAGE:$CI_COMMIT_SHA"


      # ======================================================
      # WAIT
      # ======================================================

      echo "======================================"
      echo "Waiting for Container"
      echo "======================================"

      sleep 5


      # ======================================================
      # CONTAINER STATUS
      # ======================================================

      echo "======================================"
      echo "Frontend Container Status"
      echo "======================================"

      docker ps \
        --filter "name=tambora-frontend"


      # ======================================================
      # VERIFY CONTAINER
      # ======================================================

      if [ -z "$(docker ps -q -f name=tambora-frontend)" ]; then

        echo "======================================"
        echo "ERROR: Frontend Container is NOT running"
        echo "======================================"

        docker logs --tail 100 tambora-frontend

        exit 1

      fi


      # ======================================================
      # LOGS
      # ======================================================

      echo "======================================"
      echo "Recent Frontend Logs"
      echo "======================================"

      docker logs --tail 30 tambora-frontend


      # ======================================================
      # CLEAN UNUSED IMAGES
      # ======================================================

      echo "======================================"
      echo "Cleaning Docker Images"
      echo "======================================"

      docker image prune -f


      # ======================================================
      # SUCCESS
      # ======================================================

      echo "======================================"
      echo "FRONTEND DEPLOYMENT SUCCESSFUL"
      echo "======================================"

      echo "Container : tambora-frontend"
      echo "Port      : 9091"


      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
