stages:
  - build
  - deploy

# ============================================================
# VARIABLES
# ============================================================

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/frontend

  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ============================================================
# BUILD DOCKER IMAGE
# ============================================================

build:
  stage: build

  image: docker:27

  services:
    - name: docker:27-dind

  before_script:
    - echo "======================================"
    - echo "Docker Login"
    - echo "======================================"

    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - echo "======================================"
    - echo "Building Frontend Docker Image"
    - echo "======================================"

    - docker build -t "$DOCKER_IMAGE:$CI_COMMIT_SHA" .

    - echo "======================================"
    - echo "Pushing Image"
    - echo "======================================"

    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHA"

    - echo "======================================"
    - echo "Tagging Latest"
    - echo "======================================"

    - docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHA" "$DOCKER_IMAGE:latest"

    - docker push "$DOCKER_IMAGE:latest"

    - echo "======================================"
    - echo "Build Completed"
    - echo "======================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# DEPLOY TO VPS
# ============================================================

deploy:
  stage: deploy

  image: alpine:3.22

  before_script:
    - apk add --no-cache openssh-client

    - mkdir -p ~/.ssh

    # SSH_PRIVATE_KEY adalah File Variable
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519

    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

  script:
    # ========================================================
    # TEST SSH
    # ========================================================

    - echo "======================================"
    - echo "Testing SSH Connection"
    - echo "======================================"

    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "root@$VPS_HOST" "echo 'SSH connection successful'"

    # ========================================================
    # DEPLOY
    # ========================================================

    - echo "======================================"
    - echo "Starting Frontend Deployment"
    - echo "======================================"

    - |
      ssh \
        -i ~/.ssh/id_ed25519 \
        -o StrictHostKeyChecking=yes \
        "root@$VPS_HOST" \
        "CI_REGISTRY='$CI_REGISTRY' \
         CI_REGISTRY_USER='$CI_REGISTRY_USER' \
         CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' \
         DOCKER_IMAGE='$DOCKER_IMAGE' \
         CI_COMMIT_SHA='$CI_COMMIT_SHA' \
         bash -s" << 'EOF'

      set -e

      echo "======================================"
      echo "Frontend Deployment Information"
      echo "======================================"

      echo "Docker Image : $DOCKER_IMAGE"
      echo "Commit SHA   : $CI_COMMIT_SHA"


      # ======================================================
      # LOGIN GITLAB CONTAINER REGISTRY
      # ======================================================

      echo "======================================"
      echo "Login to GitLab Container Registry"
      echo "======================================"

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" \
        -u "$CI_REGISTRY_USER" \
        --password-stdin


      # ======================================================
      # PULL NEW IMAGE
      # ======================================================

      echo "======================================"
      echo "Pulling Frontend Image"
      echo "======================================"

      docker pull "$DOCKER_IMAGE:$CI_COMMIT_SHA"


      # ======================================================
      # STOP OLD CONTAINER
      # ======================================================

      echo "======================================"
      echo "Stopping Old Frontend Container"
      echo "======================================"

      docker stop tambora-frontend 2>/dev/null || true


      # ======================================================
      # REMOVE OLD CONTAINER
      # ======================================================

      echo "======================================"
      echo "Removing Old Frontend Container"
      echo "======================================"

      docker rm tambora-frontend 2>/dev/null || true


      # ======================================================
      # START NEW CONTAINER
      # ======================================================

      echo "======================================"
      echo "Starting New Frontend Container"
      echo "======================================"

      docker run -d \
        --name tambora-frontend \
        --restart unless-stopped \
        -p 9091:9091 \
        "$DOCKER_IMAGE:$CI_COMMIT_SHA"


      # ======================================================
      # WAIT
      # ======================================================

      echo "======================================"
      echo "Waiting for Container"
      echo "======================================"

      sleep 5


      # ======================================================
      # CONTAINER STATUS
      # ======================================================

      echo "======================================"
      echo "Container Status"
      echo "======================================"

      docker ps \
        --filter "name=tambora-frontend"


      # ======================================================
      # PORT CHECK
      # ======================================================

      echo "======================================"
      echo "Port Mapping"
      echo "======================================"

      docker port tambora-frontend


      # ======================================================
      # CONTAINER LOGS
      # ======================================================

      echo "======================================"
      echo "Recent Container Logs"
      echo "======================================"

      docker logs --tail 30 tambora-frontend


      # ======================================================
      # DEPLOYMENT FINISHED
      # ======================================================

      echo "======================================"
      echo "Frontend Deployment Completed"
      echo "======================================"

      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
